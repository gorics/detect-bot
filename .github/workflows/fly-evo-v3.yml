name: Fly Neuroevolution v3.2 Quality Persistent

on:
  push:
    branches: [fly-evo-open-models]
    paths:
      - 'fly_evo_v3.py'
      - '.github/workflows/fly-evo-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fly-evo-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evolve-v32:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fly-evo-open-models
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and verify real FlyBrain
        run: |
          set -euxo pipefail
          rm -rf /tmp/flybrain
          git clone --depth 1 https://github.com/snedea/flybrain.git /tmp/flybrain
          node /tmp/flybrain/tests/run-node.js
          test -s /tmp/flybrain/data/connectome.bin.gz
          test -s /tmp/flybrain/data/neuron_meta.json
      - name: Install CPU inference stack
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install 'transformers>=4.45,<5' 'diffusers>=0.31,<1' 'accelerate>=1,<2' safetensors pillow numpy sentencepiece ftfy
      - name: Continue four quality-aware generations
        env:
          FLY_CONNECTOME: /tmp/flybrain/data/connectome.bin.gz
          HF_HOME: /tmp/hf_cache
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -euxo pipefail
          python fly_evo_v3.py | tee fly-evo-v3-live.log
      - name: Validate v3.2 outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('fly-evo-v3-results/result.json').read_text(encoding='utf-8'))
          print(json.dumps(r,ensure_ascii=False,indent=2))
          assert r['status']=='SUCCESS'
          assert r['generation_start'] >= 16
          assert r['generation_end']==r['generation_start']+4
          assert r['connectome']['neurons']==139255 and r['connectome']['edges']==2698236
          assert r['connectome']['group_slots']==63 and r['connectome']['populated_group_ids']==32
          assert r['llm']['after_score_v32'] >= r['llm']['before_score_v32']
          assert r['image']['after_score_v32'] >= r['image']['before_score_v32_recomputed']
          txt=Path('fly-evo-v3-results/llm_evolved.txt').read_text(encoding='utf-8')
          for h in ['[입력]','[뇌활성]','[생성]','[평가]','[선택]','[돌연변이]']:
            assert h in txt
          assert len(txt)>500
          assert txt.strip().endswith(('다.','니다.','.','요.'))
          assert Path('fly-evo-v3-results/sd_selected.png').stat().st_size>5000
          assert Path('fly-evo-v3-results/sd_contact_sheet_latest.png').stat().st_size>5000
          PY
      - name: Upload v3.2 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fly-evo-v32-results
          path: |
            fly-evo-v3-results/
            fly-evo-v3-live.log
          if-no-files-found: warn
          retention-days: 30
      - name: Persist champion for next generation
        if: success()
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fly-evo-v3-results fly-evo-v3-live.log
          git commit -m 'Persist Fly v3.2 champion for next generation [skip ci]' || exit 0
          for i in 1 2 3; do
            git pull --rebase origin fly-evo-open-models || true
            if git push origin HEAD:fly-evo-open-models; then exit 0; fi
            sleep $((i*2))
          done
          exit 1
