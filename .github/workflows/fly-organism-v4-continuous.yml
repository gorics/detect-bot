name: Fly Organism v5 Native-Core Continuous Evolution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fly-organism-v4-continuous.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: fly-organism-native-core-continuous
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout evolving organism branch
        uses: actions/checkout@v4
        with:
          ref: fly-evo-open-models
          fetch-depth: 30

      - name: Reconstruct verified organism sources
        run: |
          set -euxo pipefail
          cat fly_organism_v4.py.b64.0 fly_organism_v4.py.b64.1 fly_organism_v4.py.b64.2 fly_organism_v4.py.b64.3 fly_organism_v4.py.b64.4 | tr -d '\n' | base64 -d > fly_organism_v4.py
          cat fly_organism_v5.py.b64.0 fly_organism_v5.py.b64.1 fly_organism_v5.py.b64.2 | tr -d '\n' | base64 -d > fly_organism_v5.py
          python -m py_compile fly_organism_v4.py fly_organism_v5.py
          test "$(sha256sum fly_organism_v4.py | awk '{print $1}')" = "5f55676c152af98f960f89ef7f999620d29a09a98aaf7322fbf29da109c83ed3"
          test "$(sha256sum fly_organism_v5.py | awk '{print $1}')" = "353bfde37e3bb889ac8090a8dc0939f80292d899fa1e927015c63577b7e1da21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache open neural organs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: fly-organism-v4-qwen05-tinysd-clip-v1

      - name: Fetch and verify real FlyBrain
        run: |
          set -euxo pipefail
          rm -rf /tmp/flybrain
          git clone --depth 1 https://github.com/snedea/flybrain.git /tmp/flybrain
          node /tmp/flybrain/tests/run-node.js
          test -s /tmp/flybrain/data/connectome.bin.gz

      - name: Install inference runtime
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install 'transformers>=4.45,<5' 'diffusers>=0.30,<1' 'accelerate>=1,<2' safetensors pillow numpy sentencepiece ftfy

      - name: Evolve one native FlyBrain generation
        env:
          FLY_CONNECTOME: /tmp/flybrain/data/connectome.bin.gz
          FLY_V4_ROOT: .
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -euxo pipefail
          python fly_organism_v5.py | tee fly-organism-v5-live.log

      - name: Validate native topology evolution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('fly-organism-v4-results/latest_result.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps(r,ensure_ascii=False,indent=2))
          assert r['status']=='SUCCESS'
          assert r['version']=='v5-native-core-evolution'
          assert r['connectome']['neurons']==139255 and r['connectome']['edges']==2698236
          a=r['architecture']
          assert a['shared_recurrent_state'] is True
          assert a['native_flybrain_core_evolves'] is True
          assert a['breeder_always_mutates'] is True
          assert a['best_ever_elitism'] is True
          assert a['total_organism_nodes']==87
          assert r['native_core']['breeder_native_ops'] >= 1
          assert len(r['native_core']['breeder_topology_hash']) == 64
          assert Path('fly-organism-v4-results/organism_state.json').stat().st_size > 1000
          assert Path('fly-organism-v4-results/breeder.png').stat().st_size > 1000
          assert Path('fly-organism-v4-results/champion.png').stat().st_size > 1000
          PY

      - name: Upload generation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fly-organism-v5-native-core-generation
          path: |
            fly-organism-v4-results/
            fly-organism-v5-live.log
          if-no-files-found: warn
          retention-days: 30

      - name: Persist evolved native anatomy and champion
        if: success()
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fly-organism-v4-results fly-organism-v5-live.log
          git commit -m 'Evolve native FlyBrain topology generation [skip ci]' || exit 0
          for i in 1 2 3; do
            git pull --rebase origin fly-evo-open-models || true
            if git push origin HEAD:fly-evo-open-models; then exit 0; fi
            sleep $((i*2))
          done
          exit 1
