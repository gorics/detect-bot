# FlyBrain AI evolution runner - champion-gated continuation
# scheduled continuation generation 6
name: FlyBrain AI Evolution

on:
  push:
    branches: [flybrain-ai-evolution-20260929]
    paths:
      - flybrain_ai_evolution.py
      - .github/workflows/flybrain-ai-evolution.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flybrain-ai-evolution
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - name: Checkout continuing branch
        uses: actions/checkout@v4
        with:
          ref: flybrain-ai-evolution-20260929
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: pip install --quiet numpy torch transformers diffusers accelerate pillow
      - name: Download FlyBrain source
        run: |
          git clone --depth 1 https://github.com/fruitflybrain/ffbo.neuroarch_component.git /tmp/ffbo || true
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          # Existing workflow/data preparation logic remains in repository script/runtime.
          PY
      - name: Run continued evolution
        run: |
          python flybrain_ai_evolution.py --flybrain flybrain-main --out results --generations 120 --population 96 --stimulus food
      - name: Strict champion gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/results.json')
          d=json.loads(p.read_text())
          print('validation',d['evolution']['final_best_validation_accuracy'])
          PY
      - name: Commit results
        run: |
          git config user.name flybrain-evolution-bot
          git config user.email actions@users.noreply.github.com
          git add results
          git diff --cached --quiet || git commit -m 'FlyBrain evolution run: strict held-out champion gate'
          git pull --rebase origin flybrain-ai-evolution-20260929
          git push origin HEAD:flybrain-ai-evolution-20260929
