# FlyBrain recursive LoRA evolution runner - resumed generation trigger
# scheduled continuation generation 2
name: FlyBrain Direct LoRA Training

on:
  push:
    branches: [flybrain-ai-evolution-20260929]
    paths:
      - flybrain_direct_lora.py
      - .github/workflows/flybrain-direct-lora.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flybrain-direct-lora-evolution
  cancel-in-progress: false

jobs:
  train-lora:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      FLY_LLM: HuggingFaceTB/SmolLM2-135M-Instruct
      FLY_SD_TRAIN: segmind/tiny-sd
    steps:
      - name: Checkout continuing evolution branch
        uses: actions/checkout@v4
        with:
          ref: flybrain-ai-evolution-20260929
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ML and LoRA stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pillow safetensors accelerate transformers==4.57.1 diffusers==0.35.2 peft==0.17.1

      - name: Fetch real open-source FlyBrain connectome
        run: |
          rm -rf external/flybrain
          git clone --depth 1 https://github.com/snedea/flybrain.git external/flybrain
          test -s external/flybrain/data/connectome.bin.gz
          test -s results/state/best_genome.npz

      - name: Continue actual LLM and Stable Diffusion LoRA training
        run: |
          mkdir -p lora_results
          python flybrain_direct_lora.py --flybrain external/flybrain --out lora_results --sd-steps 36 | tee lora_results_run.log

      - name: Verify optimized adapter artifacts and validation
        run: |
          test -s lora_results/lora_results.json
          test -s lora_results/llm_lora/adapter_model.safetensors
          test -s lora_results/sd_unet_lora.pt
          test -s lora_results/sd_base_result.png
          test -s lora_results/sd_lora_result.png
          test -s lora_results/sd_validation.json
          test -s lora_results/llm_holdout_before.json
          test -s lora_results/llm_holdout_after.json
          cat lora_results/lora_results.json
          find lora_results -maxdepth 3 -type f -printf '%p %k KB\n'

      - name: Persist next-generation adapters and metrics
        run: |
          git config user.name 'flybrain-lora-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f lora_results/
          git diff --cached --quiet && exit 0
          git commit -m 'FlyBrain recursive LoRA generation: persist improved adapters'
          git pull --rebase origin flybrain-ai-evolution-20260929
          git push origin HEAD:flybrain-ai-evolution-20260929

      - name: Upload complete LoRA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flybrain-direct-lora-results
          path: |
            lora_results/
            lora_results_run.log
          if-no-files-found: warn
          retention-days: 14
