name: FlyBrain Evo Experiment

on:
  push:
    branches: [flybrain-evo-experiment]
    paths:
      - 'flybrain_evo/**'
      - '.github/workflows/flybrain-evo-experiment.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flybrain-evo-experiment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ML stack
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install 'transformers>=4.48,<5' 'diffusers>=0.32,<0.40' 'accelerate>=1,<2' 'peft>=0.14,<1' safetensors sentencepiece pillow numpy scipy
      - name: Clone open-source FlyBrain
        run: |
          git clone --depth 1 https://github.com/snedea/flybrain external/flybrain
          git -C external/flybrain rev-parse HEAD > flybrain_source_commit.txt
      - name: Execute exact 139k-neuron connectome worker
        run: |
          rm -rf flybrain_evo/results_v2
          mkdir -p flybrain_evo/results_v2
          node flybrain_evo/run_flybrain_worker.cjs external/flybrain flybrain_evo/results_v2
          cp flybrain_source_commit.txt flybrain_evo/results_v2/
      - name: Train SmolLM2-360M LoRA and Segmind Tiny-SD LoRA, then evolve
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python flybrain_evo/hybrid_v2.py \
            --brain flybrain_evo/results_v2/flybrain_state.json \
            --meta external/flybrain/data/neuron_meta.json \
            --out flybrain_evo/results_v2 \
            --generations 2
      - name: Upload full v2 result artifact
        uses: actions/upload-artifact@v4
        with:
          name: flybrain-evo-v2-results
          path: flybrain_evo/results_v2/
          retention-days: 7
      - name: Persist compact v2 results to experiment branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f \
            flybrain_evo/results_v2/brain_v2_summary.json \
            flybrain_evo/results_v2/llm_v2_output.txt \
            flybrain_evo/results_v2/llm_v2_training.json \
            flybrain_evo/results_v2/sd_v2_training.json \
            flybrain_evo/results_v2/evolution_v2_state.json \
            flybrain_evo/results_v2/run_report_v2.json \
            flybrain_evo/results_v2/flybrain_state.json \
            flybrain_evo/results_v2/flybrain_sd_v2_final.png \
            flybrain_evo/results_v2/sd_v2_before.png \
            flybrain_evo/results_v2/brain_condition_target.png \
            flybrain_evo/results_v2/flybrain_source_commit.txt
          git commit -m 'Persist FlyBrain v2 evolutionary run results [skip ci]' || exit 0
          git push origin HEAD:flybrain-evo-experiment
