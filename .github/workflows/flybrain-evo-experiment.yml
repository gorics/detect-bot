name: FlyBrain Evo Experiment

on:
  push:
    branches: [flybrain-evo-experiment]
    paths:
      - 'flybrain_evo/**'
      - '.github/workflows/flybrain-evo-experiment.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flybrain-evo-experiment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ML stack
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install 'transformers>=4.48,<5' 'diffusers>=0.32,<0.40' 'accelerate>=1,<2' safetensors sentencepiece pillow numpy scipy
      - name: Clone open-source FlyBrain
        run: |
          git clone --depth 1 https://github.com/snedea/flybrain external/flybrain
          git -C external/flybrain rev-parse HEAD > flybrain_source_commit.txt
      - name: Execute exact 139k-neuron connectome worker
        run: |
          rm -rf flybrain_evo/results
          mkdir -p flybrain_evo/results
          node flybrain_evo/run_flybrain_worker.cjs external/flybrain flybrain_evo/results
          cp flybrain_source_commit.txt flybrain_evo/results/
      - name: Fine-tune LLM and Stable Diffusion, then evolve
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python flybrain_evo/hybrid_runner.py \
            --brain flybrain_evo/results/flybrain_state.json \
            --meta external/flybrain/data/neuron_meta.json \
            --out flybrain_evo/results \
            --generations 3
      - name: Upload full result artifact
        uses: actions/upload-artifact@v4
        with:
          name: flybrain-evo-results
          path: flybrain_evo/results/
          retention-days: 7
      - name: Persist compact result files to experiment branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f flybrain_evo/results/brain_summary.json flybrain_evo/results/llm_output.txt flybrain_evo/results/llm_training.json flybrain_evo/results/sd_training.json flybrain_evo/results/evolution_state.json flybrain_evo/results/run_report.json flybrain_evo/results/flybrain_state.json flybrain_evo/results/flybrain_sd_final.png flybrain_evo/results/sd_before_training.png flybrain_evo/results/flybrain_source_commit.txt
          git commit -m 'Persist FlyBrain evolutionary run results [skip ci]' || exit 0
          git push origin HEAD:flybrain-evo-experiment
