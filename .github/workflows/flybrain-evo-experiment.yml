name: FlyBrain Evo Experiment

on:
  push:
    branches: [flybrain-evo-experiment]
    paths:
      - 'flybrain_evo/**'
      - '.github/workflows/flybrain-evo-experiment.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flybrain-evo-experiment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ML stack
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install 'transformers>=4.48,<5' 'diffusers>=0.32,<0.40' 'accelerate>=1,<2' 'peft>=0.14,<1' safetensors sentencepiece pillow numpy scipy
      - name: Clone exact open-source FlyBrain
        run: |
          git clone --depth 1 https://github.com/snedea/flybrain external/flybrain
          git -C external/flybrain rev-parse HEAD > flybrain_source_commit.txt
      - name: Execute exact 139k-neuron connectome worker
        run: |
          rm -rf flybrain_evo/results_v23
          mkdir -p flybrain_evo/results_v23
          node flybrain_evo/run_flybrain_worker.cjs external/flybrain flybrain_evo/results_v23
          cp flybrain_source_commit.txt flybrain_evo/results_v23/
      - name: Continue generations from V22 elite
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          test -f flybrain_evo/results_v22/evolution_v22_state.json
          python flybrain_evo/hybrid_v23.py \
            --brain flybrain_evo/results_v23/flybrain_state.json \
            --meta external/flybrain/data/neuron_meta.json \
            --previous flybrain_evo/results_v22/evolution_v22_state.json \
            --out flybrain_evo/results_v23 \
            --generations 3 \
            --population 46
      - name: Upload full v23 result artifact
        uses: actions/upload-artifact@v4
        with:
          name: flybrain-evo-v23-results
          path: flybrain_evo/results_v23/
          retention-days: 7
      - name: Persist compact v23 results to experiment branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f flybrain_evo/results_v23/*.json flybrain_evo/results_v23/*.txt flybrain_evo/results_v23/flybrain_sd_v23_final.png flybrain_evo/results_v23/sd_v3_before.png flybrain_evo/results_v23/brain_condition_target_v3.png
          git commit -m 'Persist FlyBrain v23 recursive evolution results [skip ci]' || exit 0
          git pull --rebase origin flybrain-evo-experiment
          git push origin HEAD:flybrain-evo-experiment
