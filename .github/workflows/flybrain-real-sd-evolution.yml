name: FlyBrain Real-Image SD Evolution
# scheduled continuation generation 19

on:
  push:
    branches: [flybrain-ai-evolution-20260929]
    paths:
      - flybrain_real_sd_evolution.py
      - .github/workflows/flybrain-real-sd-evolution.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flybrain-real-sd-evolution
  cancel-in-progress: false

jobs:
  evolve-real-sd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      FLY_SD_TRAIN: segmind/tiny-sd
    steps:
      - name: Checkout continuing branch
        uses: actions/checkout@v4
        with:
          ref: flybrain-ai-evolution-20260929
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install 'numpy<2' pillow requests 'diffusers>=0.35.0' 'transformers>=4.50.0' 'huggingface_hub>=0.34.0' safetensors accelerate peft
      - name: Download real Drosophila photographs
        run: |
          mkdir -p real_drosophila
          python - <<'PY'
          import requests, pathlib
          urls = {
            'Drosophila_melanogaster.jpg':'https://obbard.bio.ed.ac.uk/wp-content/uploads/2016/01/Drosophila_melanogaster.jpg',
            'Drosophila_melanogaster2_female_Sussex_July2011.jpg':'https://obbard.bio.ed.ac.uk/wp-content/uploads/2016/01/Drosophila_melanogaster2_female_Sussex_July2011.jpg',
            'Drosophila_melanogaster_Pose.jpg':'https://obbard.bio.ed.ac.uk/wp-content/uploads/2016/01/Drosophila_melanogaster_Pose.jpg',
            'Drosophila_melanogaster_alt.jpg':'https://obbard.bio.ed.ac.uk/wp-content/uploads/2016/01/Drosophila_melanogaster_alt.jpg',
            'Drosophila_melanogaster_female_Pose.jpg':'https://obbard.bio.ed.ac.uk/wp-content/uploads/2016/01/Drosophila_melanogaster_female_Pose.jpg',
            'Drosophila_melanogaster_female_Sussex_July2011.jpg':'https://obbard.bio.ed.ac.uk/wp-content/uploads/2016/01/Drosophila_melanogaster_female_Sussex_July2011.jpg',
          }
          for name,url in urls.items():
            r=requests.get(url,timeout=30); r.raise_for_status()
            pathlib.Path('real_drosophila',name).write_bytes(r.content)
          PY
      - name: Train challenger and validate against incumbent on held-out real photos
        run: python flybrain_real_sd_evolution.py --real-dir real_drosophila --out lora_results --steps 72
      - name: Commit only validated champion/evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lora_results/real_sd_evolution.json lora_results/sd_unet_lora.pt lora_results/sd_real_candidate.pt lora_results/real_base.png lora_results/real_incumbent.png lora_results/real_candidate.png lora_results/REAL_IMAGE_SOURCES.txt
          git diff --cached --quiet || git commit -m 'Continue real-image SD LoRA evolution with held-out gate'
          git push origin HEAD:flybrain-ai-evolution-20260929
      - uses: actions/upload-artifact@v4
        with:
          name: flybrain-real-sd-evolution
          path: |
            lora_results/real_sd_evolution.json
            lora_results/real_base.png
            lora_results/real_incumbent.png
            lora_results/real_candidate.png
            lora_results/sd_unet_lora.pt
            lora_results/sd_real_candidate.pt
            lora_results/REAL_IMAGE_SOURCES.txt
