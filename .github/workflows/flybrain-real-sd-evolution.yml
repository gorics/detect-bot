name: FlyBrain Real-Image SD Evolution
# generation 23: directory CLI fixed; real-photo held-out gate
on:
  push:
    branches: [flybrain-ai-evolution-20260929]
    paths: [flybrain_real_sd_evolution.py, .github/workflows/flybrain-real-sd-evolution.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flybrain-real-sd-evolution
  cancel-in-progress: false
jobs:
  evolve-real-sd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      FLY_SD_TRAIN: segmind/tiny-sd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flybrain-ai-evolution-20260929
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install 'numpy<2' pillow requests 'diffusers>=0.35.0' 'transformers>=4.50.0' 'huggingface_hub>=0.34.0' safetensors accelerate peft
      - name: Download real Drosophila photographs
        run: |
          mkdir -p real_drosophila
          python - <<'PY'
          import requests, pathlib, time
          names=['Drosophila melanogaster.jpg','Drosophila melanogaster 01.JPG','Drosophila melanogaster 14Hari.jpg','Drosophila melanogaster 1 007.jpg','Drosphila melanogaster.jpg','Drosophila melanogaster1.jpg']
          s=requests.Session(); s.headers.update({'User-Agent':'FlyBrainResearch/1.2 (github.com/gorics/detect-bot; research validation)','Accept':'image/*'})
          for i,name in enumerate(names):
            u='https://commons.wikimedia.org/wiki/Special:Redirect/file/'+requests.utils.quote(name,safe='')
            last=None
            for attempt in range(6):
              try:
                r=s.get(u,timeout=60)
                if r.status_code==429:
                  time.sleep(min(5*(2**attempt),60)); continue
                r.raise_for_status()
                if 'image' not in r.headers.get('content-type','') or len(r.content)<10000: raise RuntimeError(f'invalid image {name}')
                pathlib.Path('real_drosophila',f'real_{i:02d}.jpg').write_bytes(r.content); last=None; break
              except Exception as e:
                last=e; time.sleep(min(3*(2**attempt),45))
            if last is not None: raise last
            time.sleep(4)
          PY
      - name: Train challenger and validate against incumbent on held-out real photos
        run: python flybrain_real_sd_evolution.py --images real_drosophila --out lora_results --steps 72
      - name: Commit validated champion and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lora_results/
          git diff --cached --quiet || git commit -m 'Continue real-image SD LoRA evolution with held-out gate'
          git push origin HEAD:flybrain-ai-evolution-20260929
      - uses: actions/upload-artifact@v4
        with:
          name: flybrain-real-sd-evolution
          path: lora_results/
