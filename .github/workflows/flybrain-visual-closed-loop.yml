name: FlyBrain SD Neural Vision Closed Loop

on:
  push:
    branches: [flybrain-ai-evolution-20260929]
    paths:
      - flybrain_visual_closed_loop.py
      - .github/workflows/flybrain-visual-closed-loop.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flybrain-visual-closed-loop
  cancel-in-progress: false

jobs:
  real-vision-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flybrain-ai-evolution-20260929
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact compatible diffusion stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy<2' pillow requests safetensors accelerate transformers==4.57.1 diffusers==0.35.2 peft==0.17.1
      - name: Fetch real open-source FlyBrain connectome
        run: |
          git clone --depth 1 https://github.com/snedea/flybrain.git external/flybrain
          test -s external/flybrain/data/connectome.bin.gz
          test -s results/state/best_genome.npz
          test -s lora_results/sd_unet_lora.pt
      - name: Download six authentic Drosophila photos with unique content
        run: |
          mkdir -p real_drosophila
          python - <<'PY'
          import hashlib, pathlib, requests, time
          names=['Drosophila melanogaster.jpg','Drosophila melanogaster 01.JPG','Drosophila melanogaster 14Hari.jpg',
                 'Drosophila melanogaster 1 007.jpg','Drosphila melanogaster.jpg','Drosophila melanogaster1.jpg']
          s=requests.Session()
          s.headers.update({'User-Agent':'FlyBrainResearch/1.3 (github.com/gorics/detect-bot; research validation)','Accept':'image/*'})
          for i,name in enumerate(names):
              url='https://commons.wikimedia.org/wiki/Special:Redirect/file/'+requests.utils.quote(name,safe='')
              for n in range(8):
                  try:
                      response=s.get(url,timeout=60)
                      response.raise_for_status()
                      if 'image' not in response.headers.get('content-type','') or len(response.content)<10000:
                          raise RuntimeError('not an actual image '+name)
                      pathlib.Path('real_drosophila',f'real_{i:02d}.jpg').write_bytes(response.content)
                      print(name, hashlib.sha256(response.content).hexdigest())
                      break
                  except Exception:
                      if n==7: raise
                      time.sleep(min(8*2**n,60))
              time.sleep(5)
          paths=list(pathlib.Path('real_drosophila').glob('*.jpg'))
          assert len(paths)==6
          assert len({hashlib.sha256(p.read_bytes()).digest() for p in paths})==6, 'duplicate images'
          PY
      - name: Restore SD LoRA and evolved readout; train true neural visual conditioning
        run: |
          python flybrain_visual_closed_loop.py \
            --flybrain external/flybrain \
            --readout results/state/best_genome.npz \
            --sd-lora lora_results/sd_unet_lora.pt \
            --photos real_drosophila \
            --out visual_closed_loop_results \
            --steps 12 | tee visual_loop.log
      - name: Verify actual generated image feedback and held-out gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          out=Path('visual_closed_loop_results')
          d=json.loads((out/'results.json').read_text())
          assert d['sd_lora_restored'] and d['readout_restored']
          assert len(d['train_files'])==4 and len(d['held_out_files'])==2
          assert len(d['feedback_trace'])==3
          assert d['heldout_input_brain_state_l2']>0, 'real visual input did not reach FlyBrain'
          for k in range(3):
              image=Image.open(out/('sd_feedback_%02d.png'%k))
              image.verify()
          if d['champion_promoted']:
              assert d['candidate_heldout_real_photo_mse']<d['baseline_heldout_real_photo_mse']
              assert all(a<b for a,b in zip(d['candidate_per_photo'],d['baseline_per_photo']))
          print('PASS real-image SD -> connectome -> SD visual feedback, champion gate')
          PY
      - name: Persist evidence and gated visual bridge only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f visual_closed_loop_results/ 
          git diff --cached --quiet && exit 0
          git commit -m 'FlyBrain and SD real-photo closed loop: held-out gated visual bridge'
          for n in 1 2 3 4; do
            git pull --rebase origin flybrain-ai-evolution-20260929 && git push origin HEAD:flybrain-ai-evolution-20260929 && break
            if [ "$n" -eq 4 ]; then exit 1; fi
            sleep $((n*5))
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flybrain-sd-neural-visual-closed-loop
          path: |
            visual_closed_loop_results/
            visual_loop.log
          retention-days: 14
